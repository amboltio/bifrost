services:
  bifrost:
    build:
      context: .
      dockerfile: transports/Dockerfile.local
    image: bifrost:local
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    environment:
      APP_PORT: "8080"
      APP_HOST: "0.0.0.0"
      LOG_LEVEL: "info"
      LOG_STYLE: "pretty"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    restart: unless-stopped
